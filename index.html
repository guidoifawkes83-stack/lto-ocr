<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTO Receipt OCR</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #4f8eff;
    --accent2: #ff6b35;
    --text: #e8e8f0;
    --muted: #5a5a78;
    --success: #2dd4a0;
    --danger: #ff4466;
    --warn: #ffb830;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 24px;
  }

  .header {
    max-width: 900px;
    margin: 0 auto 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }

  .header-left h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
  }

  .header-left h1 span { color: var(--accent); }

  .header-left p {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.05em;
  }

  .stats {
    display: flex;
    gap: 24px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
  }

  .stat { text-align: right; }
  .stat-val { font-size: 1.4rem; font-weight: 700; font-family: 'Syne', sans-serif; }
  .stat-val.accent { color: var(--accent); }
  .stat-val.success { color: var(--success); }
  .stat-val.warn { color: var(--warn); }
  .stat-label { color: var(--muted); font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; }

  .main { max-width: 900px; margin: 0 auto; }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 48px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }

  .drop-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(79,142,255,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: #13131a;
  }

  .drop-zone.drag-over { border-color: var(--accent2); }

  .drop-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    display: block;
  }

  .drop-zone h2 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .drop-zone p {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }

  #fileInput { display: none; }

  .queue {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .queue-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    transition: border-color 0.2s;
  }

  .queue-item.processing { border-color: var(--accent); }
  .queue-item.done { border-color: var(--success); }
  .queue-item.duplicate { border-color: var(--warn); }
  .queue-item.error { border-color: var(--danger); }

  .item-thumb {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    background: var(--border);
  }

  .item-info { flex: 1; min-width: 0; }
  .item-name { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { color: var(--muted); font-size: 0.65rem; margin-top: 2px; }

  .item-status {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .status-pending { background: rgba(90,90,120,0.3); color: var(--muted); }
  .status-processing { background: rgba(79,142,255,0.15); color: var(--accent); }
  .status-done { background: rgba(45,212,160,0.15); color: var(--success); }
  .status-duplicate { background: rgba(255,184,48,0.15); color: var(--warn); }
  .status-error { background: rgba(255,68,102,0.15); color: var(--danger); }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(79,142,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .actions {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: #6b9fff; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-outline:hover { border-color: var(--text); }
  .btn-outline:disabled { color: var(--muted); cursor: not-allowed; }

  .btn-success {
    background: var(--success);
    color: #000;
  }

  .btn-success:hover { background: #5fffcc; transform: translateY(-1px); }
  .btn-success:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 20px;
    overflow: hidden;
    display: none;
  }

  .progress-bar.active { display: block; }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .results-section {
    margin-top: 40px;
    display: none;
  }

  .results-section.visible { display: block; }

  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .results-title {
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
  }

  th {
    background: var(--surface);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.6rem;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    white-space: nowrap;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  tr.dup-row td { color: var(--warn); }
  tr.dup-row td:first-child::before {
    content: '⚠ ';
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>LTO <span>OCR</span></h1>
    <p>OFFICIAL RECEIPT EXTRACTOR — CARAGA REGION</p>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-val accent" id="statTotal">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-val success" id="statDone">0</div>
      <div class="stat-label">Done</div>
    </div>
    <div class="stat">
      <div class="stat-val warn" id="statDups">0</div>
      <div class="stat-label">Duplicates</div>
    </div>
  </div>
</div>

<div class="main">
  <div class="drop-zone" id="dropZone">
    <span class="drop-icon">📄</span>
    <h2>Drop receipt images here</h2>
    <p>JPG, PNG, WEBP — batch upload supported</p>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <div class="queue" id="queue"></div>

  <div class="actions">
    <button class="btn btn-primary" id="btnProcess" disabled>Process Queue</button>
    <button class="btn btn-success" id="btnExport" disabled>Download Excel</button>
    <button class="btn btn-outline" id="btnClear" disabled>Clear All</button>
  </div>

  <div class="results-section" id="resultsSection">
    <div class="results-header">
      <span class="results-title">Extracted Records</span>
    </div>
    <div class="table-wrap">
      <table id="resultsTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <div class="empty-state">No records yet.</div>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const COLUMNS = ['or_number','date','payer_name','address','transaction_type','batch_id','engine_no','chassis_no','body_id','dealer','accreditation_no','legal_research_fund','reporting_fee','comp_fee','total_amount','mode_of_payment','field_office','cashier'];
const COL_LABELS = ['OR Number','Date','Payer Name','Address','Transaction','Batch ID','Engine No','Chassis No','Body ID','Dealer','Accreditation No','Legal Research Fund','Reporting Fee','Comp Fee','Total Amount','Payment Mode','Field Office','Cashier'];

let queue = [];
let results = [];
let seenOR = new Set();
let seenChassis = new Set();
let processing = false;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const queueEl = document.getElementById('queue');
const btnProcess = document.getElementById('btnProcess');
const btnExport = document.getElementById('btnExport');
const btnClear = document.getElementById('btnClear');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const resultsSection = document.getElementById('resultsSection');
const tableHead = document.getElementById('tableHead');
const tableBody = document.getElementById('tableBody');

// Build table header once
tableHead.innerHTML = '<tr>' + COL_LABELS.map(l => `<th>${l}</th>`).join('') + '<th>Status</th></tr>';

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); addFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e => addFiles(e.target.files));

function addFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const id = Date.now() + Math.random();
    const url = URL.createObjectURL(file);
    queue.push({ id, file, url, status: 'pending', result: null });
    renderQueueItem({ id, file, url, status: 'pending' });
  });
  updateStats();
  btnProcess.disabled = queue.filter(q => q.status === 'pending').length === 0;
  btnClear.disabled = false;
}

function renderQueueItem(item) {
  const div = document.createElement('div');
  div.className = 'queue-item';
  div.id = `qi-${item.id}`;
  div.innerHTML = `
    <img class="item-thumb" src="${item.url}" alt="">
    <div class="item-info">
      <div class="item-name">${item.file.name}</div>
      <div class="item-meta">${(item.file.size/1024).toFixed(1)} KB</div>
    </div>
    <span class="item-status status-pending" id="st-${item.id}">Pending</span>
  `;
  queueEl.appendChild(div);
}

function setItemStatus(id, status, label) {
  const el = document.getElementById(`qi-${id}`);
  const st = document.getElementById(`st-${id}`);
  if (!el || !st) return;
  el.className = `queue-item ${status}`;
  st.className = `item-status status-${status}`;
  st.textContent = label;

  if (status === 'processing') {
    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    spinner.id = `sp-${id}`;
    el.appendChild(spinner);
  } else {
    const sp = document.getElementById(`sp-${id}`);
    if (sp) sp.remove();
  }
}

btnProcess.addEventListener('click', async () => {
  if (processing) return;
  processing = true;
  btnProcess.disabled = true;
  btnClear.disabled = true;

  const pending = queue.filter(q => q.status === 'pending');
  progressBar.classList.add('active');

  for (let i = 0; i < pending.length; i++) {
    const item = pending[i];
    setItemStatus(item.id, 'processing', 'Processing...');
    progressFill.style.width = `${(i / pending.length) * 100}%`;

    try {
      const b64 = await toBase64(item.file);
      const res = await fetch('/api/ocr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: b64, mediaType: item.file.type })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      // Duplicate check
      const orNum = data.or_number?.trim();
      const chassis = data.chassis_no?.trim();
      const isDup = (orNum && seenOR.has(orNum)) || (chassis && seenChassis.has(chassis));

      if (orNum) seenOR.add(orNum);
      if (chassis) seenChassis.add(chassis);

      item.status = isDup ? 'duplicate' : 'done';
      item.result = { ...data, _isDuplicate: isDup, _filename: item.file.name };
      results.push(item.result);

      setItemStatus(item.id, isDup ? 'duplicate' : 'done', isDup ? 'Duplicate' : 'Done');
      appendTableRow(item.result);
      resultsSection.classList.add('visible');
    } catch (err) {
      item.status = 'error';
      setItemStatus(item.id, 'error', 'Error');
      console.error(err);
    }

    updateStats();
  }

  progressFill.style.width = '100%';
  setTimeout(() => progressBar.classList.remove('active'), 800);

  processing = false;
  btnExport.disabled = results.length === 0;
  btnClear.disabled = false;
});

function appendTableRow(record) {
  const tr = document.createElement('tr');
  if (record._isDuplicate) tr.className = 'dup-row';
  tr.innerHTML = COLUMNS.map(c => `<td title="${record[c] || ''}">${record[c] || '—'}</td>`).join('') +
    `<td>${record._isDuplicate ? '⚠ Duplicate' : '✓ OK'}</td>`;
  tableBody.appendChild(tr);
}

btnExport.addEventListener('click', () => {
  const wb = XLSX.utils.book_new();

  const clean = results.filter(r => !r._isDuplicate);
  const dups = results.filter(r => r._isDuplicate);

  const toRows = arr => arr.map(r => {
    const row = {};
    COLUMNS.forEach((c, i) => row[COL_LABELS[i]] = r[c] || '');
    row['File'] = r._filename || '';
    row['Status'] = r._isDuplicate ? 'Duplicate' : 'OK';
    return row;
  });

  if (clean.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(toRows(clean)), 'Records');
  if (dups.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(toRows(dups)), 'Duplicates');
  if (!clean.length && !dups.length) return;

  XLSX.writeFile(wb, `LTO_Receipts_${new Date().toISOString().slice(0,10)}.xlsx`);
});

btnClear.addEventListener('click', () => {
  if (processing) return;
  queue = []; results = []; seenOR.clear(); seenChassis.clear();
  queueEl.innerHTML = '';
  tableBody.innerHTML = '';
  resultsSection.classList.remove('visible');
  btnProcess.disabled = true;
  btnExport.disabled = true;
  btnClear.disabled = true;
  updateStats();
});

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function updateStats() {
  document.getElementById('statTotal').textContent = queue.length;
  document.getElementById('statDone').textContent = results.filter(r => !r._isDuplicate).length;
  document.getElementById('statDups').textContent = results.filter(r => r._isDuplicate).length;
}
</script>
</body>
</html>
